<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>aac-bridge example game</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #10131a; color: #e8ecf3; }
    main { text-align: center; padding: 24px 24px 120px; }
    .label { color: #8b95a8; text-transform: uppercase; letter-spacing: .08em; font-size: 13px; }
    #target { font-size: clamp(48px, 12vw, 96px); font-weight: 800; margin: 8px 0 16px; }
    #last { font-size: 28px; min-height: 40px; }
    .hit { color: #4fd1a5; } .miss { color: #f0806b; }
    #status { position: fixed; top: 12px; right: 12px; font-size: 13px; color: #8b95a8; }
    #phrase { margin-top: 16px; color: #8b95a8; min-height: 24px; }
  </style>
</head>
<body>
  <div id="status">waiting for an AAC app</div>
  <main>
    <div class="label">Find this word on your board</div>
    <div id="target"></div>
    <div id="last"></div>
    <div id="score">Score: 0</div>
    <div id="phrase"></div>
  </main>
  <script type="module">
    import { createAacListener, broadcastTransport, relayTransport, createPairing, mountDevPanel } from "../src/index.js";

    // Default: another tab of this site (examples/aac-app.html) over BroadcastChannel.
    // ?relay=http://localhost:8787 : pair through a relay instead. The game shows a
    // one-time code; type it into the AAC app.
    const WORDS = ["yes", "no", "eat", "drink", "more", "help", "play", "stop", "go", "like"];
    const q = new URLSearchParams(location.search);
    let transport;
    if (q.get("relay")) {
      const pairing = await createPairing({ relay: q.get("relay"), vocabulary: WORDS });
      document.getElementById("status").textContent = `pairing code: ${pairing.code}`;
      transport = relayTransport({ relay: q.get("relay"), token: pairing.listenerToken });
    } else {
      transport = broadcastTransport();
    }

    const aac = createAacListener({ transport, vocabulary: WORDS });
    mountDevPanel({ listener: aac });

    const $ = (id) => document.getElementById(id);
    let target = "", score = 0;
    const next = () => {
      const pool = WORDS.filter((w) => w !== target);
      target = pool[Math.floor(Math.random() * pool.length)];
      $("target").textContent = target;
    };
    next();

    aac.on("hello", ({ source }) => ($("status").textContent = `connected: ${source.app}`));
    aac.on("bye", () => ($("status").textContent = "AAC app stopped sharing"));
    aac.on("lost", () => ($("status").textContent = "AAC app went away"));
    aac.on("presence", ({ present }) => present || ($("status").textContent = "AAC app disconnected"));
    aac.on("symbol", ({ symbol, word }) => {
      const hit = word === target;
      $("last").textContent = symbol.text;
      $("last").className = hit ? "hit" : "miss";
      if (hit) { score++; $("score").textContent = `Score: ${score}`; next(); }
    });
    aac.on("phrase", ({ text }) => ($("phrase").textContent = `"${text}"`));
  </script>
</body>
</html>

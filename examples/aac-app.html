<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>aac-bridge example AAC app</title>
  <style>
    :root { --bg: #f5f3ee; --card: #fff; --ink: #222; --muted: #666; --on: #4fd1a5; --tile: #fff176; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--ink); }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px; background: var(--card); border-bottom: 1px solid #ddd; }
    [hidden] { display: none !important; }
    #status { font-size: 14px; padding: 6px 12px; border-radius: 999px; background: #eee; }
    #status.on { background: var(--on); font-weight: 700; }
    .panel { width: 100%; display: flex; flex-direction: column; gap: 8px; }
    .panel h2 { margin: 4px 0 0; font-size: 15px; color: var(--muted); font-weight: 600; }
    #games { display: flex; flex-wrap: wrap; gap: 8px; }
    .game { min-height: 48px; padding: 8px 16px; border-radius: 10px; border: 2px solid #4b7bec; background: #eef3ff; font-size: 17px; font-weight: 700; cursor: pointer; }
    #pair { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    #pair input[type="text"] { width: 8.5em; font-size: 20px; letter-spacing: 0.15em; padding: 8px 10px; border: 1px solid #bbb; border-radius: 8px; }
    label { display: inline-flex; gap: 6px; align-items: center; font-size: 15px; min-height: 44px; }
    input[type="checkbox"] { width: 24px; height: 24px; }
    button.small { min-height: 44px; padding: 8px 14px; border-radius: 8px; border: 1px solid #bbb; background: #fff; font-size: 15px; cursor: pointer; }
    #bar { display: flex; gap: 8px; align-items: center; padding: 8px 16px; min-height: 52px; }
    #message { flex: 1; min-height: 44px; display: flex; align-items: center; padding: 0 10px; border: 1px solid #ccc; border-radius: 8px; background: #fff; font-size: 18px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; padding: 8px 16px 24px; }
    .tile { aspect-ratio: 1; border: 0; border-radius: 14px; background: var(--tile); font-size: clamp(16px, 4.5vw, 22px); font-weight: 700; cursor: pointer; }
    .tile.dim { opacity: 0.4; }
    .tile.red { background: #ff8a80; } .tile.blue { background: #82b1ff; } .tile.green { background: #b9f6ca; } .tile.yellow { background: #ffe57f; }
    .hint { color: var(--muted); font-size: 13px; padding: 0 16px; }
  </style>
</head>
<body>
  <header>
    <div class="panel" id="connectPanel" hidden>
      <div id="nearby" hidden>
        <h2>Games nearby: tap one, then allow it on the game's screen</h2>
        <div id="games"></div>
      </div>
      <h2 id="codeTitle">Or type the code the game shows</h2>
      <div id="pair">
        <input id="code" type="text" inputmode="numeric" autocomplete="off" maxlength="7" placeholder="Code" aria-label="6-digit code from the game" />
        <button class="small" id="connect">Connect</button>
      </div>
    </div>
    <div id="waiting" hidden>
      <span id="waitingText">Waiting for the game to allow this board…</span>
      <button class="small" id="cancelWait">Cancel</button>
    </div>
    <label><input type="checkbox" id="share" disabled /> Share what I say with the game</label>
    <label id="limitRow" hidden><input type="checkbox" id="limit" checked /> Only the game's words</label>
    <button class="small" id="forget" hidden>Forget this game</button>
    <span id="status">not connected</span>
  </header>
  <div id="bar">
    <div id="message"></div>
    <button class="small" id="speak">Speak</button>
    <button class="small" id="clear">Clear</button>
  </div>
  <div class="grid" id="grid"></div>
  <p class="hint" id="hint"></p>
  <script type="module">
    import {
      createAacEmitter, broadcastTransport, relayTransport,
      claimPairing, revokePairing, listGames, requestPairing, parsePairingLink,
    } from "../src/index.js";

    // Where to pair. Served by an aac-bridge relay (local play, `--serve`),
    // the relay is this page's own origin. `?relay=` points elsewhere in
    // development. With no relay at all, it talks to games in other tabs of
    // this same site (BroadcastChannel).
    const q = new URLSearchParams(location.search);
    let discovery = false;
    async function findRelay() {
      try {
        const r = await fetch(`${q.get("relay") ?? ""}/healthz`.replace(/^\/\//, "/"), { cache: "no-store" });
        const body = await r.json();
        if (body && body.relay === "aac-bridge") {
          discovery = Boolean(body.discovery);
          return (q.get("relay") ?? location.origin).replace(/\/+$/, "");
        }
      } catch {}
      return null;
    }
    const relay = await findRelay();
    const APP = { app: "example-aac", version: "0.4.0", lang: "en" };
    const DEVICE = /Android/i.test(navigator.userAgent) ? "Android device" : /iPad|iPhone/i.test(navigator.userAgent) ? "iPhone or iPad" : "computer";
    const STORE = "aac-bridge-example-pairing";
    const $ = (id) => document.getElementById(id);
    let share = null;
    let gameWords = null;
    let gameName = "";
    let waitAbort = null;
    let listTimer = null;

    const read = () => { try { return JSON.parse(localStorage.getItem(STORE) || "null"); } catch { return null; } };
    const write = (v) => { try { v ? localStorage.setItem(STORE, JSON.stringify(v)) : localStorage.removeItem(STORE); } catch {} };

    function setStatus(text, on = false) {
      $("status").textContent = text;
      $("status").classList.toggle("on", on);
    }
    const sharingText = () => (share?.limited ? "sharing the game's words" : "sharing everything");
    const withGame = (text) => (gameName ? `${text} (${gameName})` : text);

    function showConnect(on) {
      $("connectPanel").hidden = !on;
      clearInterval(listTimer);
      listTimer = null;
      if (on && relay && discovery) {
        refreshGames();
        listTimer = setInterval(refreshGames, 3000);
      }
    }

    async function refreshGames() {
      let games = [];
      try { games = await listGames({ relay }); } catch {}
      $("nearby").hidden = games.length === 0;
      $("codeTitle").textContent = games.length ? "Or type the code the game shows" : "Type the code the game shows";
      $("games").replaceChildren(...games.map((g) => {
        const b = document.createElement("button");
        b.className = "game";
        b.textContent = g.name;
        b.addEventListener("click", () => askGame(g));
        return b;
      }));
    }

    async function askGame(g) {
      showConnect(false);
      $("waiting").hidden = false;
      $("waitingText").textContent = `Waiting for "${g.name}" to allow this board…`;
      waitAbort = new AbortController();
      try {
        const s = await requestPairing({ relay, game: g.id, app: APP.app, device: DEVICE, signal: waitAbort.signal });
        paired(s);
      } catch (err) {
        $("waiting").hidden = true;
        showConnect(true);
        setStatus(err.reason === "denied" ? "the game said no" : err.reason === "cancelled" ? "not connected" : `could not connect: ${err.message}`);
      } finally {
        waitAbort = null;
        $("waiting").hidden = true;
      }
    }
    $("cancelWait").addEventListener("click", () => waitAbort?.abort());

    function paired(s) {
      write({ relay, senderToken: s.senderToken, vocabulary: s.vocabulary ?? null, name: s.name ?? "" });
      ready(relayTransport({ relay, token: s.senderToken }), s.vocabulary, s.name);
    }

    function ready(transport, words, name = "") {
      share?.disable();
      gameWords = words && words.length ? words.map((w) => w.toLowerCase()) : null;
      gameName = name || "";
      share = createAacEmitter({ app: APP, transport });
      $("share").disabled = false;
      $("share").checked = false;
      $("limitRow").hidden = !gameWords;
      $("forget").hidden = !relay;
      showConnect(false);
      applyLimit();
      setStatus(withGame("connected, not sharing"));
    }
    function applyLimit() {
      share?.limitTo(gameWords && $("limit").checked ? gameWords : null);
      for (const b of document.querySelectorAll(".tile")) {
        b.classList.toggle("dim", Boolean(share?.limited && !gameWords.includes(b.dataset.word)));
      }
    }

    if (!relay) {
      $("hint").textContent = "No relay: sharing with games open in other tabs of this site.";
      ready(broadcastTransport(), null);
    } else {
      $("hint").textContent = `Relay: ${relay}.`;
      const saved = read();
      if (saved && saved.relay === relay) ready(relayTransport({ relay, token: saved.senderToken }), saved.vocabulary, saved.name);
      else showConnect(true);
      // Opened from a game's QR code: fill in the code, but connect only when
      // the user taps Connect, and only for this page's own relay. A link must
      // never pair or share on its own (PRIVACY.md).
      const fromLink = parsePairingLink(location.href);
      if (fromLink) {
        history.replaceState(null, "", location.pathname + location.search);
        if (fromLink.relay === relay && !read()) {
          $("code").value = `${fromLink.code.slice(0, 3)} ${fromLink.code.slice(3)}`;
          setStatus("code from the game's QR: tap Connect");
        }
      }
    }

    $("connect").addEventListener("click", async () => {
      try {
        paired(await claimPairing({ relay, code: $("code").value }));
      } catch (err) {
        setStatus(`pairing failed: ${err.message}`);
      }
    });
    $("code").addEventListener("keydown", (e) => { if (e.key === "Enter") $("connect").click(); });

    // Consent: nothing is sent until the user turns sharing on.
    $("share").addEventListener("change", () => {
      if (!share) return;
      $("share").checked ? share.enable() : share.disable();
      setStatus(withGame($("share").checked ? sharingText() : "connected, not sharing"), $("share").checked);
    });
    $("limit").addEventListener("change", () => {
      applyLimit();
      if (share?.enabled) setStatus(withGame(sharingText()), true);
    });
    $("forget").addEventListener("click", async () => {
      const saved = read();
      share?.disable();
      share = null;
      gameName = "";
      $("share").checked = false;
      $("share").disabled = true;
      if (saved) await revokePairing({ relay, token: saved.senderToken }).catch(() => {});
      write(null);
      $("forget").hidden = true;
      $("limitRow").hidden = true;
      $("code").value = "";
      for (const b of document.querySelectorAll(".tile")) b.classList.remove("dim");
      setStatus("not connected");
      showConnect(true);
    });

    const WORDS = ["go", "stop", "more", "again", "pop", "big", "red", "blue", "green", "yellow", "yes", "no", "help", "play", "eat", "sad"];
    let message = [];
    for (const w of WORDS) {
      const b = document.createElement("button");
      b.className = `tile ${w}`;
      b.textContent = w;
      b.dataset.word = w;
      b.addEventListener("click", () => {
        const symbol = { text: w, key: `example.${w}`, id: `t-${w}` };
        message.push(symbol);
        $("message").textContent = message.map((s) => s.text).join(" ");
        share?.symbol(symbol, { boardId: "home" });
      });
      $("grid").appendChild(b);
    }
    $("speak").addEventListener("click", () => {
      if (!message.length) return;
      share?.phrase(message.map((s) => s.text).join(" "), message);
    });
    $("clear").addEventListener("click", () => {
      message = [];
      $("message").textContent = "";
    });
  </script>
</body>
</html>
